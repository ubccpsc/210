ext fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.0898" x="226.8252" y="418.0684">changed, so it was</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.6641" x="232.5381" y="432.0371">not a refactoring</text><polygon fill="#F1F1F1" points="189.5576,450.8672,201.5576,462.8672,189.5576,474.8672,177.5576,462.8672,189.5576,450.8672" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#F1F1F1" points="189.5576,180.0547,201.5576,192.0547,189.5576,204.0547,177.5576,192.0547,189.5576,180.0547" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#F1F1F1" points="124.3149,494.8672,254.8003,494.8672,266.8003,506.8672,254.8003,518.8672,124.3149,518.8672,112.3149,506.8672,124.3149,494.8672" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="193.5576" y="529.0776">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="130.4854" x="124.3149" y="510.6753">is the change easy yet?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="39.1016" x="266.8003" y="504.2729">not yet</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="129.5879" x="124.7637" y="550.5776"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.6758" x="139.2197" y="571.7163">Make the bug fix</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="109.5879" x="134.7637" y="585.6851">or add the feature</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="100.168" x="139.4736